[project]
name = "psht"
binaries = ["psht-server", "psht"]
repo = "nakajima/psht"
auto-tag = true
# version_command = "git describe --tags --abbrev=0"

[build]
command = "cargo build --release --bin {binary} --target {target}"
artifact = "target/{target}/release/{binary}"
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[git]
base-url = "https://github.com"
# token_env = "GITEA_TOKEN"       # defaults: GITHUB_TOKEN or GITEA_TOKEN

[channels.git]
enabled = true

[channels.curl]

# [channels.homebrew]
# tap = "owner/homebrew-tap"
# formula_name = "psht"

[channels.cargo]
crate-name = "psht"

# [channels.nix]
# flake_repo = "owner/nix-repo"  # defaults to project repo
