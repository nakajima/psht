[package]
name = "psht"
version = "0.1.10"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
exec = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.8"

[[bin]]
name = "psht"
path = "src/main.rs"

[[bin]]
name = "psht-cli"
path = "src/bin/psht-cli.rs"

[features]
integration = []

[dev-dependencies]
tempfile = "3"
