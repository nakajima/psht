[package]
name = "psht"
version = "0.2.12"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
exec = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.8"

[[bin]]
name = "psht-server"
path = "src/main.rs"

[[bin]]
name = "psht"
path = "src/bin/psht.rs"

[features]
integration = []

[dev-dependencies]
tempfile = "3"
